name: 交易引擎和终端验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: mmex_test
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EXCHANGE_TEST_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:15439/mmex_test?sslmode=disable
      EXCHANGE_E2E_DATABASE_URL: postgres://postgres:isolated-test-only@127.0.0.1:15439/mmex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run check:worker --prefix frontend
      - run: |
          cp .env.example .env
          docker compose config --quiet
      - run: docker build -t mingmiao-exchange:check .
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - run: npm run test:ui --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-screenshots
          path: frontend/test-results/
