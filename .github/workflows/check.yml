name: 交易引擎和终端验证
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n deploy.sh scripts/release.sh
      - name: nginx TLS 与文件描述符回归验证
        run: python3 scripts/check-deploy.py
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: go build -o bin/exchange ./cmd/exchange
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-screenshots
          path: frontend/test-results/
